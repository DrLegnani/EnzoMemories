name: EnzoMemories
options:
  bundleIdPrefix: com.andre
targets:
  EnzoMemories:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: EnzoMemories
        excludes:
          - "Resources/**"
      - path: EnzoMemories/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andre.enzomemories
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: EnzoMemories/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5.5"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
